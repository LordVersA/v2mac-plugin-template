# At a tag: build the plugin on its base image, attach the image archive and the filled plugin.json
# to a GitHub Release. Submit the repo URL and tag to the V2Mac store (see README).
name: Release
on:
  push:
    tags: ["v*", "hello-pty-v*", "hello-gui-v*"]
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Select the plugin
        id: plugin
        env: { RELEASE_TAG: "${{ github.ref_name }}" }
        run: |
          case "$RELEASE_TAG" in
            hello-pty-v*) dir=hello-pty ;;
            hello-gui-v*) dir=hello-gui ;;
            v*) dir=. ;;
            *) exit 2 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Pull the base image
        env: { PLUGIN_DIR: "${{ steps.plugin.outputs.dir }}" }
        run: docker pull "$(cat "$PLUGIN_DIR/base.txt")"
      - name: Package
        env:
          PLUGIN_DIR: ${{ steps.plugin.outputs.dir }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: Scripts/package.sh "$PLUGIN_DIR" "$(cat "$PLUGIN_DIR/base.txt")" "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG" "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_DIR: ${{ steps.plugin.outputs.dir }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.tar dist/plugin.json "$PLUGIN_DIR/icon.svg" --title "$RELEASE_TAG" --notes "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("changelog",""))' "$PLUGIN_DIR/plugin.json")"
